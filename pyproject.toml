[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "preprocessor"
version = "0.1.0"
description = "Intelligent, context-aware data preprocessing library"
requires-python = ">=3.8"
license = "MIT"

dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "scipy>=1.7"
]

# EXPLICIT PACKAGE DECLARATION (NO AUTO DISCOVERY)
[tool.setuptools]
packages = ["preprocessor"]
