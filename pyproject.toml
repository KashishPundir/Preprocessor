[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preprocessor"
version = "0.1.0"
description = "Intelligent, context-aware data preprocessing library for data science"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

authors = [
    { name = "Kashish Pundir", email = "kashishpundir1303@gmail.com" }
]

keywords = [
    "data-science",
    "machine-learning",
    "preprocessing",
    "eda",
    "feature-engineering",
    "automation"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries"
]

dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "scipy>=1.7"
]

[project.urls]
Homepage = "https://github.com/yourusername/cognia-preprocess"
Repository = "https://github.com/yourusername/cognia-preprocess"
Issues = "https://github.com/yourusername/cognia-preprocess/issues"
